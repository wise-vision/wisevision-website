# wv-lead-mailer: companion Worker that owns `send_email` for wisevision.tech leads.
# Pages Functions cannot hold a send_email binding; the Pages project reaches this Worker ONLY through
# its `LEAD_MAILER` service binding (see ../../wrangler.toml). Zero public surface by design:
#   workers_dev = false, preview_urls = false, no routes, no custom domain.
# Tests: functions-dev/test/mailer.test.ts. Deploy: see functions-dev/README.md (CI deploys it on main).
name = "wv-lead-mailer"
main = "src/index.ts"
compatibility_date = "2026-08-15"
workers_dev = false
preview_urls = false

[vars]
LEAD_TO = "adam.krawczyk0698@gmail.com"
LEAD_FROM = "leads@wisevision.tech"

[[send_email]]
name = "LEAD_MAIL"
destination_address = "adam.krawczyk0698@gmail.com"
allowed_sender_addresses = ["leads@wisevision.tech"]
