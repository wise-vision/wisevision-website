name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: tokens are up to date (generated files match tokens.source.json)
        run: npm run tokens && git diff --exit-code -- src/styles/tokens.css src/styles/tokens.json
      - name: astro check
        run: npm run check
      - name: vitest + coverage (>=80% lines on scripts/** and src/lib/**)
        run: npm test
      - name: contrast gate (WCAG AA on every declared pair)
        run: npm run contrast
      - name: build
        run: npm run build
      - name: dist grep gate (no people, no office@, no Cookiebot, no MIT)
        run: bash scripts/dist-grep-gate.sh dist
      - name: expected routes exist
        run: |
          for f in index.html ros2-mcp/index.html wiseos/index.html defence/index.html contact/index.html privacy/index.html 404.html docs/index.html docs/ros2-mcp/quickstart/index.html llms.txt sitemap-index.xml robots.txt; do
            test -f "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done

  claims-lint:
    name: claims-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: claims lint (provided by worker B; skipped until scripts/claims-lint.mjs exists)
        run: |
          if [ -f scripts/claims-lint.mjs ]; then
            [ -f package-lock.json ] && npm ci
            node scripts/claims-lint.mjs
          else
            echo "scripts/claims-lint.mjs not present yet; skipping"
          fi
