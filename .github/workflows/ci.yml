name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main mid-deploy; superseded PR runs may be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: media (GitHub Release media-v1 → public/media; skipped while the release does not exist)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view media-v1 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p public/media && gh release download media-v1 -R "$GITHUB_REPOSITORY" -D public/media --clobber
          else
            echo "release media-v1 not found; building without /media"
          fi
      - name: tokens are up to date (generated files match tokens.source.json)
        run: npm run tokens && git diff --exit-code -- src/styles/tokens.css src/styles/tokens.json
      - name: astro check
        run: npm run check
      - name: vitest + coverage (>=80% lines on scripts/** and src/lib/**)
        run: npm test
      - name: node:test (claims lint, redirects, link audit)
        run: node --test 'scripts/tests/*.test.mjs'
      - name: contrast gate (WCAG AA on every declared pair)
        run: npm run contrast
      - name: build (prebuild syncs the ROS2 MCP tool reference; fails if the pin is not the latest release)
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: docs .md twins match their pages (and are linked from <head>)
        run: node scripts/md-twin-parity.mjs dist
      - name: dist grep gate (no people, no office@, no Cookiebot, no MIT)
        run: bash scripts/dist-grep-gate.sh dist
      - name: claims lint on copy AND built dist/ (banned terms + anchored capability claims)
        run: node scripts/claims-lint.mjs
      - name: link audit (every internal href/src and every _redirects target resolves in dist/)
        run: node scripts/link-audit.mjs dist --list-external
      - name: expected routes exist
        run: |
          for f in index.html og/home.png og/ros2-mcp.png ros2-mcp/index.html wiseos/index.html defence/index.html contact/index.html privacy/index.html 404.html docs/index.html docs/ros2-mcp/quickstart/index.html docs/ros2-mcp/quickstart.md docs/ros2-mcp/connect/index.html docs/ros2-mcp/security/index.html docs/ros2-mcp/tools/index.html docs/ros2-mcp/prompts/index.html docs/ros2-mcp/data-black-box/index.html docs/wiseos/index.html docs/faq/index.html _headers llms.txt sitemap-index.xml robots.txt; do
            test -f "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done
      - name: media shipped in dist (every media-v1 asset lands in dist/media for the deploy artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view media-v1 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            ls dist/media/*.mp4 >/dev/null || { echo "media-v1 exists but dist/media has no .mp4"; exit 1; }
            for f in public/media/*; do test -f "dist/media/$(basename "$f")" || { echo "missing dist/media/$(basename "$f")"; exit 1; }; done
            ls -la dist/media
          else
            echo "release media-v1 not found; no media check"
          fi
      - name: upload dist for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  functions:
    name: functions + lead-mailer (Workers runtime tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            functions-dev/package-lock.json
            package-lock.json
            workers/lead-mailer/package-lock.json
      # Root deps: vite resolves the nearest tsconfig for files outside functions-dev/ (the root one, which extends astro's).
      - run: npm ci
      - run: npm ci
        working-directory: functions-dev
      # The mailer's own deps (mimetext) resolve from workers/lead-mailer/, which the tests import.
      - run: npm ci
        working-directory: workers/lead-mailer
      - name: typecheck (functions/, workers/lead-mailer/, src/lib/lead-form.ts, tests)
        run: npm run typecheck
        working-directory: functions-dev
      - name: vitest in workerd + coverage (>=80% lines)
        run: npm run coverage
        working-directory: functions-dev
      - name: Pages Functions compile from the repo root (no staging)
        run: functions-dev/node_modules/.bin/wrangler pages functions build --outdir "$RUNNER_TEMP/fn"
      - name: lead-mailer bundles (dry run)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/mailer"
        working-directory: workers/lead-mailer

  hero-e2e:
    # Separate job so the required build + test job is not slowed by the Playwright browser install.
    name: hero e2e (WebGL off, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: build
        run: npm run build
      - name: poster is LCP, gate keeps it, zero console errors (desktop + mobile)
        run: npx playwright test

  claims-lint:
    name: claims-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: claims lint (provided by worker B; skipped until scripts/claims-lint.mjs exists)
        run: |
          if [ -f scripts/claims-lint.mjs ]; then
            [ -f package-lock.json ] && npm ci
            node scripts/claims-lint.mjs
          else
            echo "scripts/claims-lint.mjs not present yet; skipping"
          fi

  # SECURITY: this job runs on a SELF-HOSTED runner (adam-xps-wvsite, label wvsite-deploy)
  # because the Cloudflare token is IP-allowlisted and GitHub-hosted egress is not in the list.
  # The repo is public, so this job must NEVER run for pull_request / pull_request_target:
  # the `if:` below gates it to push-to-main only, and the wvsite-deploy label is used by
  # nothing else. Fork PRs additionally need maintainer approval (all_external_contributors).
  deploy:
    name: deploy (Cloudflare Pages wisevision + Worker wv-lead-mailer)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test, functions, claims-lint]
    runs-on: [self-hosted, wvsite-deploy]
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://wisevision.tech
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The self-hosted workspace persists between runs: never deploy a stale dist.
      - name: clear previous dist
        run: rm -rf dist
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # The mailer goes first: the Pages project's LEAD_MAILER service binding points at it.
      - name: deploy Worker wv-lead-mailer (no routes, workers_dev=false)
        working-directory: workers/lead-mailer
        run: npm ci && npx wrangler deploy
      # Run from the repo root so wrangler reads ./wrangler.toml and bundles ./functions.
      - name: deploy Pages (dist + functions/)
        run: npx --yes wrangler@4.143.1 pages deploy dist --project-name wisevision --branch main --commit-hash "$GITHUB_SHA" --commit-message "ci deploy $GITHUB_SHA"
      - name: post-deploy smoke
        run: |
          set -e
          sleep 10
          for i in 1 2 3 4 5; do curl -sf -o /dev/null https://wisevision.tech/ && break; sleep 10; done
          curl -sf -o /dev/null https://wisevision.tech/
          curl -sf -o /dev/null https://wisevision.tech/llms.txt
          code=$(curl -s -o /dev/null -w '%{http_code}' https://wisevision.tech/api/lead)
          [ "$code" = "405" ] || { echo "GET /api/lead answered $code, expected 405 (Functions not deployed?)"; exit 1; }
          echo "smoke ok: /, /llms.txt, /api/lead (405)"
